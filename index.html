<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1f5e">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Hero Academy</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;font-family:system-ui,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif;background:#1b1f5e;color:#fff;overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 20% 0%,#3b3fb5,#1b1f5e 62%)}
#top{display:flex;align-items:center;gap:8px;padding:8px 12px}
#journey{flex:1;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dot{width:32px;height:32px;border-radius:50%;background:#ffffff22;display:grid;place-items:center;font-size:17px;opacity:.55}
.dot.done{background:#ffd93b;opacity:1}
.dot.cur{background:#fff;opacity:1;transform:scale(1.25)}
#stars{font-size:22px;font-weight:700;color:#ffd93b;white-space:nowrap}
#gear{background:none;border:0;font-size:24px;opacity:.35;color:#fff;padding:6px}
#testChip{display:none;background:#ff5252;color:#fff;border-radius:10px;padding:3px 8px;font-weight:800;font-size:13px}
#skipBtn{display:none;background:#ff5252;color:#fff;border:0;border-radius:10px;padding:5px 10px;font-weight:700}
body.test #testChip,body.test #skipBtn{display:inline-block}
#heroRow{display:flex;align-items:center;gap:10px;padding:2px 14px}
#heroFace{width:62px;height:74px;display:grid;place-items:center}
#bubble{background:#fff;color:#222;border-radius:18px;padding:10px 14px;font-size:clamp(17px,2.4vw,24px);line-height:1.35;flex:1;min-height:52px}
#again{background:#ffd93b;border:0;border-radius:50%;width:54px;height:54px;font-size:26px;flex:none}
#stage{flex:1;position:relative;padding:8px 14px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:0;overflow:auto}
.btn{background:#ffd93b;color:#2b2b2b;border:0;border-radius:22px;padding:14px 30px;font-size:26px;font-weight:700;box-shadow:0 5px 0 #c9a700;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c9a700}
.btn.small{font-size:18px;padding:8px 16px;border-radius:14px}
.choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.choice{background:#fff;color:#222;border:0;border-radius:24px;padding:10px 18px;font-size:48px;min-width:110px;min-height:110px;box-shadow:0 6px 0 #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit}
.choice small{font-size:20px;font-weight:700;color:#444}
.choice .ltr{font-size:64px;font-weight:800}
.choice.txt{font-size:22px;max-width:340px;text-align:left;flex-direction:row;gap:12px;font-weight:600}
.choice.txt span:first-child{font-size:44px}
.choice.wide{font-size:30px;max-width:320px;word-break:break-all}
.choice.ok{background:#6ee7a0}
.choice.hint{outline:6px solid #ffd93b}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.card{background:#ffffff18;border-radius:28px;padding:16px 30px;text-align:center}
.bigL{font-size:clamp(80px,16vw,150px);font-weight:800;line-height:1.05}
.pic{font-size:clamp(70px,14vw,120px);line-height:1.1}
.cap{font-size:clamp(20px,3vw,28px);font-weight:700;text-align:center}
.field{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:720px}
.item{background:#ffffff1f;border:0;border-radius:18px;font-size:44px;width:76px;height:76px;position:relative;color:#fff}
.item i{position:absolute;right:-4px;bottom:-6px;background:#ffd93b;color:#222;border-radius:12px;font-size:20px;font-style:normal;font-weight:800;padding:0 7px}
.item.counted{background:#6ee7a044}
.plate{min-height:120px;width:min(720px,94%);background:#ffffff22;border:4px dashed #fff8;border-radius:24px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;justify-content:center;align-items:center}
.slots{display:flex;gap:12px}
.slot{width:96px;height:110px;border:5px dashed #fff9;border-radius:20px;display:grid;place-items:center;font-size:64px;font-weight:800}
.slot.full{border-style:solid;background:#6ee7a0;color:#222}
.tiles{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;min-height:110px}
.tile{width:92px;height:100px;background:#ffd93b;color:#222;border-radius:20px;display:grid;place-items:center;font-size:62px;font-weight:800;box-shadow:0 6px 0 #c9a700;touch-action:none;position:relative}
.tile.used{visibility:hidden}
.prow{display:flex;gap:8px;font-size:clamp(34px,6vw,54px);align-items:center;flex-wrap:wrap;justify-content:center}
.prow .q{background:#fff3;border-radius:14px;padding:0 10px}
.grid{display:grid;gap:4px;background:#ffffff18;padding:6px;border-radius:16px}
.cell{display:grid;place-items:center;background:#ffffff1c;border-radius:10px}
.prog{display:flex;gap:6px;min-height:58px;flex-wrap:wrap;justify-content:center}
.pslot{width:50px;height:50px;border:3px dashed #fff8;border-radius:12px;display:grid;place-items:center;font-size:28px}
.arrows{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.arr{background:#fff;border:0;border-radius:16px;width:68px;height:68px;font-size:34px}
.tracebox{flex:1;width:100%;max-width:760px;min-height:240px;background:#ffffff14;border-radius:24px;position:relative}
.tracebox canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;border-radius:24px}
.off{text-align:center;max-width:680px;display:flex;flex-direction:column;gap:10px;align-items:center}
.off .ic{font-size:84px}
.off .st{font-size:clamp(22px,3.2vw,32px);font-weight:700;line-height:1.4}
.off .pr{font-size:16px;opacity:.8;background:#0003;border-radius:12px;padding:6px 12px}
.off .tm{font-size:34px;font-weight:800;color:#ffd93b;font-variant-numeric:tabular-nums}
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;width:min(880px,96%)}
.plan div,.plan button{background:#ffffff18;border-radius:14px;padding:8px 10px;font-size:15px;display:flex;gap:8px;align-items:center;color:#fff;border:0;text-align:left;font-family:inherit}
.plan b{font-size:24px}
.team{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.team .m{display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:700;width:96px;text-align:center}
.team .m small{font-weight:400;opacity:.8;font-size:11px}
.float{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
#fx span{position:absolute;top:-40px;font-size:30px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
.pop{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(.2);opacity:0}50%{transform:scale(1.4);opacity:1}100%{transform:scale(1)}}
#modal{position:fixed;inset:0;background:#000c;z-index:60;display:grid;place-items:center;overflow:auto}
#modal[hidden]{display:none}
.panel{background:#fff;color:#222;border-radius:20px;padding:18px;width:min(620px,95%);max-height:94vh;overflow:auto;font-size:16px;-webkit-user-select:text;user-select:text}
.panel h2{margin:0 0 8px}
.panel details{border:1px solid #ddd;border-radius:12px;margin:8px 0;padding:6px 12px}
.panel summary{font-weight:800;font-size:17px;padding:6px 0;cursor:pointer}
.panel label{display:block;margin:10px 0 2px;font-weight:700}
.panel label.inl{display:flex;gap:8px;align-items:center;font-weight:600}
.panel input[type=text],.panel input[type=number],.panel input[type=password],.panel input[type=url],.panel input[type=time],.panel select{width:100%;font-size:17px;padding:8px;border:2px solid #bbb;border-radius:10px}
.panel .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.panel button{font-size:15px;padding:8px 14px;border-radius:10px;border:0;background:#3b3fb5;color:#fff;font-family:inherit}
.panel button.red{background:#c0392b}
.panel button.grey{background:#777}
.panel pre{background:#f1f1f1;padding:8px;border-radius:8px;white-space:pre-wrap;font-size:12px;max-height:140px;overflow:auto}
.panel table{border-collapse:collapse;width:100%;font-size:13px}
.panel td,.panel th{border:1px solid #ddd;padding:4px 6px;text-align:left}
.panel .note{font-size:13px;color:#666}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center;margin:12px 0}
.pinpad button{height:64px;font-size:26px;border-radius:16px;background:#eef;color:#222}
.pindots{text-align:center;font-size:30px;letter-spacing:10px;min-height:40px}
</style>
</head>
<body>
<div id="app">
  <div id="top"><span id="testChip">TEST</span><button id="skipBtn">Skip ⏭</button><div id="journey"></div><div id="stars">⭐ 0</div><button id="gear" aria-label="parent">⚙️</button></div>
  <div id="heroRow"><div id="heroFace" class="float"></div><div id="bubble"></div><button id="again" aria-label="repeat">🔊</button></div>
  <div id="stage"></div>
</div>
<div id="modal" hidden></div>
<div id="fx"></div>

<script>
/* ---------- logging first (visible in Parent area → Data) ---------- */
(function(){
  var buf=[];try{buf=JSON.parse(localStorage.getItem('ha_log')||'[]')}catch(e){}
  window.L=function(m){try{buf.push(new Date().toISOString().slice(5,19).replace('T',' ')+' '+m);if(buf.length>120)buf=buf.slice(-120);localStorage.setItem('ha_log',JSON.stringify(buf))}catch(e){}};
  window.addEventListener('error',function(e){window.L('ERR '+e.message+' @'+e.lineno)});
  window.addEventListener('unhandledrejection',function(e){window.L('REJ '+(e.reason&&e.reason.message||e.reason))});
  window.L('boot');
})();
const APPV='2.0.0';

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const NUM=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

/* ---------- storage: IndexedDB (main) + localStorage mirror ---------- */
const DB={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('heroAcademy',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv')};r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>{L('idb open fail');res(false)}}catch(e){L('idb missing');res(false)}})},
  get(k){return new Promise(res=>{const fb=()=>{try{res(JSON.parse(localStorage.getItem('ha_'+k)))}catch(e){res(null)}};if(!this.db)return fb();try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>q.result==null?fb():res(q.result);q.onerror=fb}catch(e){fb()}})},
  set(k,v){return new Promise(res=>{try{localStorage.setItem('ha_'+k,JSON.stringify(v))}catch(e){}if(!this.db)return res();try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(JSON.parse(JSON.stringify(v)),k);t.oncomplete=()=>res();t.onerror=()=>{L('idb write fail');res()}}catch(e){L('idb put err '+e.message);res()}})}
};
const DEF={v:2,name:'',day:1,stars:0,badges:[],history:[],reward:'',rewardEvery:5,oncePerDay:true,
  win:{on:false,from:'15:00',to:'17:00'},content:{off:[],maxCount:0},
  voice:{on:true,mode:'single',rate:0.9},sec:{salt:'',hash:''},sync:{url:'',token:'',last:'',dirty:false},test:false};
let S=JSON.parse(JSON.stringify(DEF));
let LOCAL={bioId:''}; /* device-only, never synced */
function merge(base,over){for(const k in over){if(over[k]&&typeof over[k]==='object'&&!Array.isArray(over[k])&&base[k]&&typeof base[k]==='object')merge(base[k],over[k]);else base[k]=over[k]}return base}
let pushTimer=null;
async function save(){
  await DB.set('state',S);
  if(S.test)return;
  if(S.sync.url&&S.sync.token){S.sync.dirty=true;clearTimeout(pushTimer);pushTimer=setTimeout(syncPush,3000)}
}
const saveLocal=()=>DB.set('local',LOCAL);

/* ---------- cloud sync (Apps Script + Google Sheet) ---------- */
function exportable(){const o=JSON.parse(JSON.stringify(S));delete o.sync;o.test=false;return o}
async function callSync(action,data){
  const r=await fetch(S.sync.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:S.sync.token,action,data})});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'sync error');return j;
}
let syncing=false;
async function syncPush(){
  if(!S.sync.url||!S.sync.token||syncing||S.test)return false;
  syncing=true;
  try{await callSync('push',exportable());S.sync.last=new Date().toISOString();S.sync.dirty=false;await DB.set('state',S);L('sync ok');return true}
  catch(e){L('sync fail '+e.message);S.sync.dirty=true;await DB.set('state',S);return false}
  finally{syncing=false}
}
async function syncPull(){
  const j=await callSync('pull');
  if(!j.data)throw new Error('No saved data in the Sheet yet');
  const keep={sync:S.sync};
  S=merge(JSON.parse(JSON.stringify(DEF)),j.data);S.sync=keep.sync;S.test=false;
  await DB.set('state',S);
}
window.addEventListener('online',()=>{if(S.sync.dirty)syncPush()});

/* ---------- voice: Hindi teacher, English target words ---------- */
let VOICES=[];
function refreshVoices(){try{VOICES=speechSynthesis.getVoices()||[]}catch(e){VOICES=[]}}
if('speechSynthesis' in window){refreshVoices();speechSynthesis.onvoiceschanged=refreshVoices}
const hasHi=()=>VOICES.some(v=>/^hi/i.test(v.lang));
function pick(lang){const l=lang.toLowerCase().replace('_','-');return VOICES.find(v=>v.lang.toLowerCase().replace('_','-')===l)||VOICES.find(v=>v.lang.toLowerCase().startsWith(l.slice(0,2)))}
let speakId=0,LAST=[];
function say1(text,lang,rate){return new Promise(res=>{
  if(!S.voice.on||!('speechSynthesis' in window)||!text){res();return}
  const u=new SpeechSynthesisUtterance(text);u.lang=lang;const v=pick(lang);if(v)u.voice=v;u.rate=rate||0.9;u.pitch=1.05;
  let done=false;const fin=()=>{if(!done){done=true;res()}};
  u.onend=fin;u.onerror=fin;setTimeout(fin,12000);
  try{speechSynthesis.speak(u)}catch(e){fin()}})}
/* parts: 'हिंदी text' or ['English word','en'] */
function toUtter(parts){
  if(S.voice.mode==='single')return [[parts.map(p=>typeof p==='string'?p:p[0]).join(' '),'hi-IN']];
  return parts.map(p=>typeof p==='string'?[p,'hi-IN']:[p[0],p[1]==='en'?'en-IN':'hi-IN']);
}
async function say(...parts){
  const id=++speakId;
  try{speechSynthesis.cancel()}catch(e){}
  await sleep(80);
  for(const [t,l] of toUtter(parts)){if(id!==speakId)return;await say1(t,l,S.voice.rate)}
}
function stopVoice(){speakId++;try{speechSynthesis.cancel()}catch(e){}}
/* show English on screen, speak Hinglish */
function hero(display,parts){$('#bubble').textContent=display;LAST=parts||[display];return say(...LAST)}
$('#again').onclick=()=>say(...LAST);

/* ---------- the Hero Team (original characters, drawn in SVG) ---------- */
const TEAM={
  blaze:{name:'Blaze',suit:'#e53935',dark:'#a31515',mask:'#ff9800',belt:'#ffd54f',power:'Super-fast flyer',extra:'cape',ini:'B'},
  jet:{name:'Jet',suit:'#1e88e5',dark:'#0d47a1',mask:'#90caf9',belt:'#cfd8dc',power:'Flying suit with wings',extra:'wings',ini:'J'},
  vine:{name:'Vine',suit:'#43a047',dark:'#1b5e20',mask:'#2e7d32',belt:'#8d6e63',power:'Vine swing & rescue nets',extra:'vine',ini:'V'},
  echo:{name:'Echo',suit:'#8e24aa',dark:'#4a148c',mask:'#ce93d8',belt:'#ffd54f',power:'Super hearing',extra:'waves',ini:'E'},
  heart:{name:'Heart',suit:'#f9a825',dark:'#e65100',mask:'#ec407a',belt:'#ffffff',power:'Kindness power',extra:'sparkle',ini:'H'}
};
function heroSVG(k,size=64){
  const h=TEAM[k];let back='',head='',boots='';
  if(h.extra==='cape')back=`<path d="M34 50 Q18 95 26 114 L74 114 Q82 95 66 50 Z" fill="${h.dark}"/>`;
  if(h.extra==='wings')back=`<path d="M36 56 L3 42 L13 64 L1 74 L36 72 Z" fill="#b0bec5"/><path d="M64 56 L97 42 L87 64 L99 74 L64 72 Z" fill="#b0bec5"/>`;
  if(h.extra==='vine')back=`<path d="M66 46 C92 30 98 72 78 74 C62 76 66 54 84 58" stroke="#6d4c41" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="90" cy="42" rx="5" ry="3" fill="#7cb342"/><ellipse cx="82" cy="64" rx="4" ry="2.6" fill="#7cb342"/><path d="M8 84 l12 0 l-6 10 z M6 84 l16 10 M22 84 l-16 10" stroke="#a1887f" stroke-width="1.5" fill="none"/>`;
  if(h.extra==='waves')back=`<path d="M22 28 Q14 38 22 48 M13 22 Q1 38 13 54 M78 28 Q86 38 78 48 M87 22 Q99 38 87 54" stroke="${h.mask}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  if(h.extra==='sparkle')back=`<path d="M14 26 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#fff59d"/><path d="M84 40 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#fff59d"/>`;
  if(k==='jet'||k==='blaze')boots=`<path d="M39 108 L43 119 L47 108Z M53 108 L57 119 L61 108Z" fill="#ff9800"/>`;
  if(k==='jet'){
    head=`<circle cx="50" cy="32" r="16" fill="#f2c9a0"/><path d="M32 34 A18 18 0 0 1 68 34 L68 30 A18 18 0 0 0 32 30 Z" fill="${h.suit}"/><path d="M32 33 A18 18 0 0 1 68 33 Z" fill="${h.suit}"/><rect x="35" y="26" width="30" height="10" rx="5" fill="#e3f2fd" stroke="${h.dark}" stroke-width="1.5"/><path d="M44 41 Q50 45 56 41" stroke="#6d4c41" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  }else{
    head=`<circle cx="50" cy="32" r="16" fill="#f2c9a0"/><path d="M34 30 Q35 13 50 14 Q65 13 66 30 Q58 21 50 23 Q42 21 34 30Z" fill="#3e2723"/><rect x="35" y="27" width="30" height="9" rx="4.5" fill="${h.mask}"/><ellipse cx="44" cy="31.5" rx="3.6" ry="2.6" fill="#fff"/><ellipse cx="56" cy="31.5" rx="3.6" ry="2.6" fill="#fff"/><circle cx="44.5" cy="31.8" r="1.3" fill="#222"/><circle cx="55.5" cy="31.8" r="1.3" fill="#222"/><path d="M44 39 Q50 44 56 39" stroke="#6d4c41" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    if(k==='echo')head+=`<circle cx="34" cy="33" r="4.5" fill="${h.dark}"/><circle cx="66" cy="33" r="4.5" fill="${h.dark}"/>`;
  }
  const body=`<rect x="38" y="80" width="10" height="26" rx="4" fill="${h.dark}"/><rect x="52" y="80" width="10" height="26" rx="4" fill="${h.dark}"/><rect x="36" y="102" width="14" height="7" rx="3" fill="${h.belt}"/><rect x="50" y="102" width="14" height="7" rx="3" fill="${h.belt}"/>${boots}
  <rect x="34" y="47" width="32" height="36" rx="10" fill="${h.suit}"/><rect x="34" y="74" width="32" height="5" fill="${h.belt}"/>
  <path d="M37 52 L22 36" stroke="${h.suit}" stroke-width="8" stroke-linecap="round"/><circle cx="21" cy="34" r="5" fill="${h.dark}"/>
  <path d="M63 52 L74 66" stroke="${h.suit}" stroke-width="8" stroke-linecap="round"/><circle cx="75" cy="68" r="5" fill="${h.dark}"/>
  <circle cx="50" cy="61" r="8.5" fill="#fff"/>`+
  (k==='heart'?`<path d="M50 66 C42 60 44 54 47.5 55 C49 55.4 50 57 50 57 C50 57 51 55.4 52.5 55 C56 54 58 60 50 66Z" fill="#ec407a"/>`
   :`<text x="50" y="65.6" text-anchor="middle" font-size="12" font-weight="900" fill="${h.suit}" font-family="Arial,sans-serif">${h.ini}</text>`);
  return `<svg viewBox="0 0 100 120" width="${Math.round(size*100/120)}" height="${size}" aria-label="${h.name}">${back}${body}${head}</svg>`;
}

/* ---------- fx ---------- */

function ask(stage,{q,sp,opts,correct,cls,head,wrongMsg}){
  return new Promise(res=>{
    if(head)stage.appendChild(el('div','prow',head));
    const wrap=el('div','choices');let wrong=0,locked=false;
    opts.forEach((o,i)=>{
      const b=el('button','choice'+(cls?' '+cls:''),o);wrap.appendChild(b);
      b.onclick=()=>{
        if(locked)return;
        if(correct==null||i===correct){locked=true;b.classList.add('ok');confetti(10);res({i,wrong})}
        else{
          wrong++;noteWrong();b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),500);
          if(wrongMsg)hero(wrongMsg[0],wrongMsg[1]);else hero('Try again! 💪',['कोई बात नहीं, फिर से try करो!']);
          if(wrong>=2&&wrap.children[correct])wrap.children[correct].classList.add('hint');
        }
      };
    });
    stage.appendChild(wrap);hero(q,sp);
  });
}

/* ===== Build a word ===== */
function buildWord(stage,[word,emoji,hi]){
  return new Promise(res=>{
    stage.innerHTML='';
    const letters=[...word];
    const pic=el('div','pic',emoji),slots=el('div','slots');
    const sl=letters.map(()=>{const s=el('div','slot');slots.appendChild(s);return s});
    const extras=shuffle(learned(DAYV).filter(x=>!letters.includes(x))).slice(0,2);
    const tiles=el('div','tiles');
    const tl=shuffle([...letters,...extras]).map(c=>{const t=el('div','tile',c);t.dataset.c=c;tiles.appendChild(t);return t});
    stage.append(pic,slots,tiles);
    hero('What is this? Put the letters in the boxes — drag or tap.',['यह क्या है? Letters को सही box में रखो — खींचो या touch करो।']);
    let filled=0;
    async function finishWord(){
      confetti(14);await sleep(300);
      await hero(`${word.toUpperCase()} — ${word}!`,[...letters.map(c=>SND[c]),'…',[word,'en'],`! ${word} मतलब ${hi}।`]);
      res();
    }
    function attempt(t,idx){
      const c=t.dataset.c;
      if(idx!=null&&idx>=0&&letters[idx]===c&&!sl[idx].classList.contains('full')){
        sl[idx].textContent=c;sl[idx].classList.add('full');t.classList.add('used');filled++;
        if(filled===letters.length)finishWord();else say(SND[c]);
      }else{noteWrong();t.classList.add('shake');setTimeout(()=>t.classList.remove('shake'),500);hero('Not here — try another letter!',['यह letter यहाँ नहीं आएगा, दूसरा try करो!'])}
    }
    tl.forEach(t=>{
      let drag=false,sx=0,sy=0,moved=false;
      t.addEventListener('pointerdown',e=>{if(t.classList.contains('used'))return;try{t.setPointerCapture(e.pointerId)}catch(_){}sx=e.clientX;sy=e.clientY;moved=false;drag=true;t.style.zIndex=9;t.style.transition='none'});
      t.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>10)moved=true;t.style.transform=`translate(${dx}px,${dy}px) scale(1.15)`});
      t.addEventListener('pointerup',e=>{
        if(!drag)return;drag=false;t.style.transition='transform .2s';t.style.transform='';t.style.zIndex='';
        let idx=-1;
        if(moved)idx=sl.findIndex(s=>{const r=s.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom});
        else idx=letters.findIndex((c,i)=>c===t.dataset.c&&!sl[i].classList.contains('full'));
        attempt(t,idx);
      });
      t.addEventListener('pointercancel',()=>{drag=false;t.style.transform=''});
    });
  });
}
async function blkWord(stage,done){
  const ws=wordsFor(DAYV);
  if(ws.length>=2){
    const td=letterOf(DAYV);
    const chosen=[...shuffle(ws.filter(w=>w[0].includes(td))),...shuffle(ws.filter(w=>!w[0].includes(td)))].slice(0,3);
    for(const w of chosen)await buildWord(stage,w);
  }else{
    const pool=learned(DAYV);
    for(let k=0;k<3;k++){
      stage.innerHTML='';
      const target=rnd(pool);
      const others=shuffle(SEQ.filter(x=>x!==target&&!conflict(x,target))).slice(0,2);
      const letters=shuffle([target,...others]);
      await ask(stage,{q:'Listen! Which letter makes this sound?',sp:['ध्यान से सुनो…',SND[target],'। यह कौन से letter की आवाज़ है?'],opts:letters.map(x=>`<span class="ltr">${x.toUpperCase()}</span>`),correct:letters.indexOf(target)});
      await hero(`Yes! ${target.toUpperCase()}`,['वाह!',[target.toUpperCase(),'en'],'!']);
    }
  }
  done();
}

/* ===== Counting ===== */
const FRUIT=['🍎','🍌','🍇','🍊','🍓','🥕','🍅','🥭','🍆','🌽'];
const maxCountFor=day=>S.content.maxCount>0?Math.min(20,S.content.maxCount):Math.min(20,10+Math.floor((day-1)/2));
function tapCount(stage,N,emo){
  return new Promise(res=>{
    stage.innerHTML='';
    const f=el('div','field');let c=0;
    for(let i=0;i<N;i++){
      const b=el('button','item',emo);
      b.onclick=()=>{
        if(b.classList.contains('counted'))return;
        c++;b.classList.add('counted');b.innerHTML=`${emo}<i>${c}</i>`;
        say([NUM[c],'en']);
        if(c===N)setTimeout(res,900);
      };
      f.appendChild(b);
    }
    stage.appendChild(f);
    hero('Touch each one and count!',['हर एक को touch करो और गिनो!']);
  });
}
function feed(stage,N,emo){
  return new Promise(res=>{
    stage.innerHTML='';
    const plate=el('div','plate'),tray=el('div','field');let cnt=0;
    const info=el('div','cap','');
    const upd=()=>{info.innerHTML=`Feed Blaze ${N} ${emo} &nbsp; (now: ${cnt})`};upd();
    for(let i=0;i<N+4;i++){
      const b=el('button','item',emo);
      b.onclick=()=>{
        if(b.dataset.in)return;
        b.dataset.in=1;b.style.visibility='hidden';cnt++;
        const p=el('button','item',emo);p.style.width=p.style.height='60px';p.style.fontSize='34px';
        p.onclick=()=>{p.remove();b.style.visibility='visible';delete b.dataset.in;cnt--;upd()};
        plate.appendChild(p);upd();say([NUM[Math.min(cnt,20)],'en']);
      };
      tray.appendChild(b);
    }
    const ok=el('button','btn','Done ✔');
    ok.onclick=async()=>{
      if(cnt===N){confetti(20);await hero('Yummy! Blaze is full!',['वाह! Blaze का पेट भर गया!']);res()}
      else{noteWrong();if(cnt<N)hero(`Now ${cnt}. Blaze needs more!`,['अभी',[NUM[Math.min(cnt,20)],'en'],'हैं। और चाहिए!']);else hero(`Now ${cnt}. Too many — Blaze needs only ${N}.`,['अभी',[NUM[Math.min(cnt,20)],'en'],'हैं। थोड़े कम करो — सिर्फ़',[NUM[N],'en'],'चाहिए।'])}
    };
    stage.append(info,plate,tray,ok);
    hero(`Feed Blaze ${N}. Touch a fruit to put it on the plate.`,['Blaze को',[NUM[N],'en'],'fruits खिलाओ। Fruit को touch करो, वो plate में जाएगा।']);
  });
}
async function blkCount(stage,done){
  const mx=maxCountFor(DAYV),lo=DAYV<3?3:5;
  for(let r=0;r<2;r++){
    const N=ri(lo,r===0?Math.min(mx,10):mx),emo=rnd(FRUIT);
    await tapCount(stage,N,emo);
    let nums=[...new Set([N,N+1,Math.max(1,N-1),N+2])].filter(x=>x!==N);
    const opts=shuffle([N,...shuffle(nums).slice(0,2)]);
    await ask(stage,{q:'How many are there?',sp:['Total कितने हैं?'],opts:opts.map(x=>`<span class="ltr">${x}</span>`),correct:opts.indexOf(N)});

    stage.innerHTML='';
    const a=ri(2,9);let b=ri(2,9);if(b===a)b=a+1;
    const ea=rnd(FRUIT);let eb=rnd(FRUIT);if(eb===ea)eb=FRUIT[(FRUIT.indexOf(ea)+1)%FRUIT.length];
    const more=Math.random()<.5,correct=more?(a>b?0:1):(a<b?0:1);
    await ask(stage,{q:more?'Which group has MORE?':'Which group has LESS?',sp:[more?'किस group में':'किस group में',[more?'more':'less','en'],'है?'],opts:[ea.repeat(a),eb.repeat(b)],correct,cls:'wide'});
    await hero('Well done!',['शाबाश!']);
  }
  done();
}

const SYM=['🔴','🔵','🟢','🟡','⭐','❤️','🔺','🟣'];
async function blkPattern(stage,done){
  const types=DAYV<6?['AB']:DAYV<13?['AABB','AB']:['AABB','ABB','ABC'];
  for(let k=0;k<3;k++){
    stage.innerHTML='';
    const type=rnd(types),pool=shuffle(SYM),map={A:pool[0],B:pool[1],C:pool[2]};
    const unit=[...type].map(c=>map[c]),L=unit.length*2+1;
    const full=Array.from({length:L},(_,i)=>unit[i%unit.length]),ans=full[L-1];
    stage.appendChild(el('div','prow',full.slice(0,L-1).map(x=>`<span>${x}</span>`).join('')+'<span class="q">❓</span>'));
    const opts=shuffle([ans,...pool.filter(x=>x!==ans).slice(0,2)]);
    await ask(stage,{q:'Finish the pattern — what comes next?',sp:['Pattern पूरा करो — next कौन सा आएगा?'],opts:opts.map(x=>`<span>${x}</span>`),correct:opts.indexOf(ans)});
    await hero('Super pattern!',['वाह! सही pattern!']);
  }
  done();
}

const DIR={u:[0,-1,'⬆️','up'],d:[0,1,'⬇️','down'],l:[-1,0,'⬅️','left'],r:[1,0,'➡️','right']};
function mazeOne(stage,mz){
  return new Promise(res=>{
    stage.innerHTML='';
    const cs=Math.max(44,Math.min(72,Math.floor(Math.min(innerWidth*.9/mz.w,300/mz.h))));
    const grid=el('div','grid');grid.style.gridTemplateColumns=`repeat(${mz.w},${cs}px)`;
    const isWall=(x,y)=>mz.walls.some(w=>w[0]===x&&w[1]===y);
    const jet=heroSVG('jet',Math.floor(cs*.9));
    function draw(p){
      grid.innerHTML='';
      for(let y=0;y<mz.h;y++)for(let x=0;x<mz.w;x++){
        const c=el('div','cell');c.style.width=c.style.height=cs+'px';c.style.fontSize=Math.floor(cs*.6)+'px';
        if(p[0]===x&&p[1]===y)c.innerHTML=jet;
        else if(mz.g[0]===x&&mz.g[1]===y)c.textContent='⭐';
        else if(isWall(x,y))c.textContent='🧱';
        grid.appendChild(c);
      }
    }
    draw(mz.s);
    let prog=[],running=false;
    const pr=el('div','prog');
    const renderProg=()=>{pr.innerHTML='';for(let i=0;i<Math.max(6,prog.length);i++)pr.appendChild(el('div','pslot',prog[i]?DIR[prog[i]][2]:''))};
    renderProg();
    const arrows=el('div','arrows');
    Object.keys(DIR).forEach(k=>{const b=el('button','arr',DIR[k][2]);b.onclick=()=>{if(running||prog.length>=12)return;prog.push(k);renderProg();say([DIR[k][3],'en'])};arrows.appendChild(b)});
    const back=el('button','arr','⌫');back.onclick=()=>{if(running)return;prog.pop();renderProg()};
    const go=el('button','arr','▶️');go.style.background='#6ee7a0';
    arrows.append(back,go);
    stage.append(grid,pr,arrows);
    hero('Help Jet fly to the star ⭐. Tap arrows to plan the path, then press ▶.',['Jet को star तक पहुँचाओ! Arrows दबाकर रास्ता बनाओ, फिर play दबाओ।']);
    go.onclick=async()=>{
      if(running||!prog.length)return;running=true;
      let p=[...mz.s];draw(p);
      for(const d of prog){
        await sleep(450);
        const n=[p[0]+DIR[d][0],p[1]+DIR[d][1]];
        if(n[0]<0||n[1]<0||n[0]>=mz.w||n[1]>=mz.h||isWall(n[0],n[1])){
          noteWrong();await hero('Oops! The path is blocked. Think again.',['अरे! रास्ता बंद है। फिर से सोचो।']);draw(mz.s);running=false;return;
        }
        p=n;draw(p);
        if(p[0]===mz.g[0]&&p[1]===mz.g[1]){confetti(24);await hero('Jet reached the star!',['वाह! Jet star तक पहुँच गया!']);res();return}
      }
      noteWrong();await hero('Not there yet — change or add arrows.',['अभी star दूर है। Arrows बदलो या और जोड़ो।']);draw(mz.s);running=false;
    };
  });
}

/* ===== Tracing ===== */
function shapePath(g,kind,W,H){
  const cx=W/2,cy=H/2,r=Math.min(W,H)*0.36;g.beginPath();
  if(kind==='circle')g.arc(cx,cy,r,0,Math.PI*2);
  else if(kind==='square')g.rect(cx-r,cy-r,2*r,2*r);
  else if(kind==='triangle'){g.moveTo(cx,cy-r);g.lineTo(cx+r*1.1,cy+r*0.8);g.lineTo(cx-r*1.1,cy+r*0.8);g.closePath()}
  else{for(let i=0;i<10;i++){const rr=i%2?r*0.45:r,a=-Math.PI/2+i*Math.PI/5;g[i?'lineTo':'moveTo'](cx+rr*Math.cos(a),cy+rr*Math.sin(a))}g.closePath()}
}
function fontFor(t,W,H){const n=t.length;const size=n===1?Math.min(H*0.85,W*0.7):Math.min(H*0.55,W/(n*0.65));return `700 ${Math.floor(size)}px Arial, Helvetica, sans-serif`}
function drawGlyph(g,item,W,H,mode){
  g.save();
  if(item.shape){
    shapePath(g,item.shape,W,H);
    if(mode==='mask'){g.lineWidth=46;g.strokeStyle='#000';g.stroke()}
    else{g.lineWidth=5;g.strokeStyle='#fff';g.setLineDash([2,12]);g.lineCap='round';g.stroke()}
  }else{
    g.font=fontFor(item.t,W,H);g.textAlign='center';g.textBaseline='middle';
    if(mode==='mask'){g.fillStyle='#000';g.fillText(item.t,W/2,H/2)}
    else{g.fillStyle='rgba(255,255,255,.18)';g.fillText(item.t,W/2,H/2);g.lineWidth=3;g.strokeStyle='#fff';g.setLineDash([2,10]);g.lineCap='round';g.strokeText(item.t,W/2,H/2)}
  }
  g.restore();
}
function traceOne(stage,item){
  return new Promise(res=>{
    stage.innerHTML='';
    const box=el('div','tracebox'),cv=el('canvas');box.appendChild(cv);stage.appendChild(box);
    const W=Math.max(300,box.clientWidth),H=Math.max(220,box.clientHeight);
    cv.width=W;cv.height=H;
    const g=cv.getContext('2d');
    const mask=document.createElement('canvas');mask.width=W;mask.height=H;const mg=mask.getContext('2d');drawGlyph(mg,item,W,H,'mask');
    const ink=document.createElement('canvas');ink.width=W;ink.height=H;const ig=ink.getContext('2d');
    ig.lineCap='round';ig.lineJoin='round';ig.lineWidth=46;ig.strokeStyle='#ffd93b';
    const redraw=()=>{g.clearRect(0,0,W,H);drawGlyph(g,item,W,H,'guide');g.drawImage(ink,0,0)};
    redraw();
    let drawing=false,last=null,finished=false;
    const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
    const clearBtn=el('button','btn small','🗑 Clear');
    clearBtn.onclick=()=>{ig.clearRect(0,0,W,H);redraw()};
    stage.appendChild(clearBtn);
    const skipTimer=setTimeout(()=>{if(finished)return;const b=el('button','btn small','Done ✔');b.onclick=()=>{finished=true;res()};stage.appendChild(b)},20000);
    function score(){
      const md=mg.getImageData(0,0,W,H).data,idt=ig.getImageData(0,0,W,H).data;
      let m=0,mc=0,inkN=0,out=0;
      for(let y=0;y<H;y+=6)for(let x=0;x<W;x+=6){const i=(y*W+x)*4+3,a=md[i]>100,b=idt[i]>100;if(a){m++;if(b)mc++}if(b){inkN++;if(!a)out++}}
      return {cov:m?mc/m:0,out:inkN?out/inkN:1};
    }
    cv.addEventListener('pointerdown',e=>{if(finished)return;try{cv.setPointerCapture(e.pointerId)}catch(_){}drawing=true;last=pos(e);ig.beginPath();ig.moveTo(last[0],last[1]);ig.lineTo(last[0]+.1,last[1]+.1);ig.stroke();redraw()});
    cv.addEventListener('pointermove',e=>{if(!drawing||finished)return;const p=pos(e);ig.beginPath();ig.moveTo(last[0],last[1]);ig.lineTo(p[0],p[1]);ig.stroke();last=p;redraw()});
    cv.addEventListener('pointerup',async()=>{
      if(!drawing)return;drawing=false;
      if(finished)return;
      const s=score();
      if(s.cov>=0.5&&s.out<=0.6){finished=true;clearTimeout(skipTimer);confetti(24);await hero('Beautiful tracing!',['वाह! कितना सुंदर trace किया!']);res()}
      else if(s.out>0.6){noteWrong();hero('Try to stay inside the lines.',['थोड़ा line के अंदर रहो। फिर से try करो!'])}
      else hero('Good! Colour a little more.',['बहुत अच्छे! थोड़ा और रंग भरो।']);
    });
    cv.addEventListener('pointercancel',()=>{drawing=false});
  });
}

    {k:'hands',icon:'🧱',title:'Hands-on maths',min:7,lead:'blaze',run:(s,d)=>offline(s,d,OFF.hands(day))},
    {k:'pattern',icon:'🎨',title:'Patterns',min:3,lead:'jet',run:blkPattern},
    {k:'logic',icon:mz?'🧭':'🎯',title:mz?'Maze coding':'Colour & shape',min:6,lead:'jet',run:mz?blkMaze:blkSort},
    {k:'trace',icon:'✏️',title:'Finger tracing',min:5,lead:'vine',run:blkTrace},
    {k:'paper',icon:'📒',title:'Notebook time',min:6,lead:'vine',run:(s,d)=>offline(s,d,OFF.paper(day))},
    {k:'discover',icon:'🌍',title:'Discover the world',min:5,lead:'vine',run:blkDiscover},
    {k:'story',icon:'💛',title:'Friends & habits',min:4,lead:'heart',run:blkStory}];
}
const buildBlocks=day=>allBlocks(day).filter(b=>!S.content.off.includes(b.k));

/* ---------- session engine ---------- */
let TESTDAY=1;
function renderJourney(){
  const j=$('#journey');j.innerHTML='';
  if(SESS)SESS.blocks.forEach((b,i)=>j.appendChild(el('div','dot'+(i<SESS.i?' done':i===SESS.i?' cur':''),b.icon)));
  $('#stars').textContent='⭐ '+S.stars;
  document.body.classList.toggle('test',!!S.test);
}
function inWindow(){
  if(!S.win.on)return true;
  const d=new Date(),m=d.getHours()*60+d.getMinutes();
  const [fh,fm]=S.win.from.split(':').map(Number),[th,tm]=S.win.to.split(':').map(Number);
  return m>=fh*60+fm&&m<=th*60+tm;
}
function startSession(day,blocks,single){
  RUNID++;DAYV=day;
  SESS={blocks,i:0,stars:0,start:Date.now(),wrong:{},mood:'',single:!!single};
  runBlock();
}
function runBlock(){
  stopVoice();
  const myRun=RUNID,myI=SESS.i,b=SESS.blocks[SESS.i];
  CURKEY=b.k;setLead(b.lead);renderJourney();
  const stage=$('#stage');stage.innerHTML='';
  let once=false;
  L('block '+b.k+' day '+DAYV+(S.test?' TEST':''));
  try{b.run(stage,()=>{if(once||myRun!==RUNID||!SESS||SESS.i!==myI)return;once=true;blockDone()})}
  catch(e){L('blockerr '+b.k+' '+e.message);blockDone()}
}
function blockDone(){
  const myRun=RUNID;
  SESS.stars++;
  if(!S.test){S.stars++;save()}
  renderJourney();
  const stage=$('#stage');stage.innerHTML='';
  stage.appendChild(el('div','pic pop','⭐'));
  confetti(12);
  hero('Another star! ⭐',['एक और star!']);
  setTimeout(()=>{if(myRun!==RUNID||!SESS)return;SESS.i++;if(SESS.i>=SESS.blocks.length)finishScreen();else runBlock()},1500);
}
async function finishScreen(){
  const stage=$('#stage');stage.innerHTML='';setLead('heart');
  const mins=Math.round((Date.now()-SESS.start)/60000);
  const titles=Object.fromEntries(allBlocks(DAYV).map(b=>[b.k,b.title]));
  const weak=Object.entries(SESS.wrong).filter(([k,v])=>v>=2).map(([k,v])=>`${titles[k]||k} (${v})`).join(', ');
  const badge=BADGES[(DAYV-1)%BADGES.length];
  let rewardNow='';
  if(!S.test&&!SESS.single){
    S.badges.push(badge);
    S.history.push({d:today(),day:DAYV,stars:SESS.stars,mins,mood:SESS.mood,weak});
    if(S.history.length>400)S.history=S.history.slice(-400);
    S.day=DAYV+1;
    const n=S.history.length;
    if(S.reward&&S.rewardEvery>0&&n%S.rewardEvery===0)rewardNow=S.reward;
    await save();
  }
  const team=el('div','team');Object.keys(TEAM).forEach(k=>{const m=el('div','m float',heroSVG(k,80)+TEAM[k].name);m.style.animationDelay=(Math.random()*1)+'s';team.appendChild(m)});
  stage.append(team,el('div','bigL pop',badge),el('div','cap',`Mission ${DAYV} complete! ⭐ ${SESS.stars} stars${S.test?' (test — not saved)':''}`));
  if(rewardNow)stage.appendChild(el('div','cap',`🎁 Reward: ${esc(rewardNow)}`));
  confetti(50);
  const b=el('button','btn','Home 🏠');b.onclick=home;stage.appendChild(b);
  SESS=null;RUNID++;$('#journey').innerHTML='';renderJourney();
  const sp=[`शाबाश ${kidName()}! आज का पूरा mission complete! Hero team को आप पर proud है!`];
  if(rewardNow)sp.push('और आपका reward है —',rewardNow);
  hero(`Well done, ${kidName()}! The Hero Team is proud of you!`,sp);
}
function home(){
  SESS=null;RUNID++;stopVoice();setLead('blaze');renderJourney();
  const stage=$('#stage');stage.innerHTML='';
  const team=el('div','team');
  Object.keys(TEAM).forEach(k=>{const m=el('div','m',`<div class="float" style="animation-delay:${Math.random()}s">${heroSVG(k,78)}</div>${TEAM[k].name}<small>${TEAM[k].power}</small>`);m.onclick=()=>say([TEAM[k].name,'en']);team.appendChild(m)});
  stage.appendChild(team);
  if(S.test){testHome(stage);return}
  const bl=buildBlocks(S.day),nm=kidName();
  $('#bubble').textContent=`Hi ${nm}! Mission ${S.day} is ready. Shall we start?`;
  LAST=[`नमस्ते ${nm}! आज का mission number ${S.day} ready है। चलो शुरू करें?`];
  stage.appendChild(el('div','cap',`🏅 Mission ${S.day} · Badges: ${S.badges.length} ${S.badges.slice(-8).join(' ')}`));
  const last=S.history[S.history.length-1];
  if(S.oncePerDay&&last&&last.d===today()){
    $('#bubble').textContent=`Mission done for today! See you tomorrow, ${nm}!`;LAST=[`आज का mission हो गया! कल फिर मिलेंगे, ${nm}!`];return;
  }
  if(!inWindow()){
    $('#bubble').textContent=`The Hero Team is resting now. Come back at ${S.win.from}.`;LAST=['अभी Hero team आराम कर रही है। बाद में आना!'];return;
  }
  const plan=el('div','plan');bl.forEach(b=>plan.appendChild(el('div','',`<b>${b.icon}</b><span>${b.title}<br><small>${b.min} min</small></span>`)));
  stage.appendChild(plan);
  if(('speechSynthesis' in window)&&VOICES.length&&!hasHi())stage.appendChild(el('div','cap','⚠️ Hindi voice not found — ask a grown-up to check settings'));
  const go=el('button','btn','Start Mission 🚀');
  go.onclick=()=>startSession(S.day,bl,false);
  stage.appendChild(go);
}
function testHome(stage){
  $('#bubble').textContent='TEST MODE — nothing is saved. Pick a day and any block.';LAST=['Test mode'];
  const row=el('div','cap',`Test day: <button class="btn small" id="tdm">−</button> <span id="tdv">${TESTDAY}</span> <button class="btn small" id="tdp">+</button>`);
  stage.appendChild(row);
  const plan=el('div','plan');
  const draw=()=>{
    $('#tdv').textContent=TESTDAY+` (letter ${letterOf(TESTDAY).toUpperCase()})`;
    plan.innerHTML='';
    allBlocks(TESTDAY).forEach(b=>{const x=el('button','',`<b>${b.icon}</b><span>${b.title}</span>`);x.onclick=()=>startSession(TESTDAY,[b],true);plan.appendChild(x)});
  };
  stage.appendChild(plan);draw();
  $('#tdm').onclick=()=>{TESTDAY=Math.max(1,TESTDAY-1);draw()};
  $('#tdp').onclick=()=>{TESTDAY=Math.min(60,TESTDAY+1);draw()};
  const go=el('button','btn','Run full session ▶');go.onclick=()=>startSession(TESTDAY,buildBlocks(TESTDAY),false);stage.appendChild(go);
}
$('#skipBtn').onclick=()=>{if(SESS&&S.test)blockDone()};

/* ---------- security: PIN + device fingerprint/face ---------- */
async function hashPin(pin,salt){
  const data=new TextEncoder().encode(salt+':'+pin);
  if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
  let x=5381;for(const b of data)x=((x*33)^b)>>>0;return 'w'+x.toString(16);
}
const bioAvail=()=>!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext);
async function bioRegister(){
  const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Hero Academy'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'parent',displayName:'Parent'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
  LOCAL.bioId=b64(cred.rawId);await saveLocal();
}
async function bioCheck(){
  const a=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(LOCAL.bioId)}],userVerification:'required',timeout:60000}});
  return !!a;
}
let failCount=0,lockUntil=0;
function pinPad(title,onDone,opts={}){
  const m=$('#modal');m.hidden=false;let pin='';
  m.innerHTML=`<div class="panel" style="max-width:360px"><h2>${title}</h2><div class="note">${opts.note||''}</div><div class="pindots" id="pd"></div><div class="pinpad">${[1,2,3,4,5,6,7,8,9,'✕',0,'✔'].map(x=>`<button data-k="${x}">${x}</button>`).join('')}</div><div class="row" style="justify-content:center">${opts.bio?'<button id="bioB">🔐 Fingerprint / Face</button>':''}<button class="grey" id="pcan">Cancel</button></div><div class="note" id="pmsg" style="text-align:center;color:#c0392b"></div></div>`;
  const pd=$('#pd');
  m.querySelectorAll('.pinpad button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(k==='✕')pin=pin.slice(0,-1);
    else if(k==='✔'){if(pin.length>=4)onDone(pin,msg=>{$('#pmsg').textContent=msg;pin='';pd.textContent=''})}
    else if(pin.length<6)pin+=k;
    pd.textContent='●'.repeat(pin.length);
  });
  $('#pcan').onclick=()=>{m.hidden=true;if(opts.onCancel)opts.onCancel()};
  if(opts.bio)$('#bioB').onclick=async()=>{try{if(await bioCheck()){openParent()}}catch(e){$('#pmsg').textContent='Fingerprint/face not available — use PIN';L('bio '+e.message)}};
}
function askUnlock(){
  if(!S.sec.hash){setupWizard();return}
  pinPad('Parent area',async(pin,err)=>{
    if(Date.now()<lockUntil)return err('Too many tries. Wait 30 seconds.');
    if(await hashPin(pin,S.sec.salt)===S.sec.hash){failCount=0;openParent()}
    else{failCount++;if(failCount>=5){lockUntil=Date.now()+30000;failCount=0}err('Wrong PIN')}
  },{bio:bioAvail()&&!!LOCAL.bioId});
}
function setupWizard(){
  let first='';
  pinPad('Welcome! Set a parent PIN',(pin,err)=>{
    first=pin;
    pinPad('Enter the PIN again',async(p2,err2)=>{
      if(p2!==first){err2('PINs do not match. Start again.');setTimeout(setupWizard,900);return}
      S.sec.salt=b64(crypto.getRandomValues(new Uint8Array(12)));S.sec.hash=await hashPin(p2,S.sec.salt);await save();
      openParent(true);
    },{note:'Confirm your PIN',onCancel:setupWizard});
  },{note:'4–6 digits. Only grown-ups should know this. You can add fingerprint/face later.',onCancel:()=>{if(!S.sec.hash)setupWizard()}});
}
let pressT=null;
const gear=$('#gear');
gear.addEventListener('pointerdown',()=>{pressT=setTimeout(askUnlock,1500)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>gear.addEventListener(ev,()=>clearTimeout(pressT)));

/* ---------- parent area ---------- */
function openParent(firstRun){
  const m=$('#modal');m.hidden=false;
  let logs='';try{logs=(JSON.parse(localStorage.getItem('ha_log')||'[]')).slice(-25).reverse().join('\n')}catch(e){}
  const hist=S.history.slice(-14).reverse().map(h=>`<tr><td>${h.d}</td><td>${h.day}</td><td>${h.stars}</td><td>${h.mins??''}</td><td>${esc(h.mood||'')}</td><td>${esc(h.weak||'—')}</td></tr>`).join('')||'<tr><td colspan="6">No missions yet</td></tr>';
  const blocks=allBlocks(1).map(b=>`<label class="inl"><input type="checkbox" data-blk="${b.k}" ${S.content.off.includes(b.k)?'':'checked'}> ${b.icon} ${b.title}</label>`).join('');
  m.innerHTML=`<div class="panel"><h2>⚙️ Parent area <small style="font-size:12px;color:#888">v${APPV}</small></h2>
  ${firstRun?'<p class="note">PIN saved. Fill in the child\'s name, then press Save.</p>':''}
  <details open><summary>👦 Child & schedule</summary>
    <label>Child's name (used for tracing — English letters)</label><input type="text" id="pn" value="${esc(S.name)}">
    <label>Current mission (day)</label><input type="number" id="pd" min="1" value="${S.day}">
    <label class="inl"><input type="checkbox" id="pod" ${S.oncePerDay?'checked':''}> Only one mission per day</label>
    <label class="inl"><input type="checkbox" id="pwo" ${S.win.on?'checked':''}> Allow only between these times</label>
    <div class="row"><input type="time" id="pwf" value="${S.win.from}" style="width:45%"><input type="time" id="pwt" value="${S.win.to}" style="width:45%"></div>
  </details>
  <details><summary>📚 Content</summary>${blocks}
    <label>Max counting number (0 = automatic, grows from 10 to 20)</label><input type="number" id="pmc" min="0" max="20" value="${S.content.maxCount}">
  </details>
  <details><summary>🔊 Voice</summary>
    <p class="note">Hindi voice: <b>${hasHi()?'found ✅':'not found ❌'}</b> (${VOICES.length} voices). If missing: Android Settings → General management → Text-to-speech → Google → install Hindi.</p>
    <label class="inl"><input type="checkbox" id="pvo" ${S.voice.on?'checked':''}> Voice on</label>
    <label>Voice style</label><select id="pvm"><option value="single" ${S.voice.mode==='single'?'selected':''}>One Hindi voice reads everything (smooth, Indian accent)</option><option value="dual" ${S.voice.mode==='dual'?'selected':''}>Hindi voice + English voice for English words</option></select>
    <label>Speed: <span id="prv">${S.voice.rate}</span></label><input type="range" id="pvr" min="0.6" max="1.2" step="0.05" value="${S.voice.rate}" style="width:100%">
    <div class="row"><button id="vt">▶ Test voice</button></div>
  </details>
  <details><summary>🎁 Rewards</summary>
    <label>Real-life reward</label><input type="text" id="prw" value="${esc(S.reward)}" placeholder="e.g. ice-cream at the park">
    <label>Give the reward after every … missions</label><input type="number" id="pre" min="1" max="30" value="${S.rewardEvery}">
    <p class="note">Stars so far: ${S.stars} · Badges: ${S.badges.length}</p>
  </details>
  <details><summary>📈 Report</summary>
    <table><tr><th>Date</th><th>Mission</th><th>⭐</th><th>Min</th><th>Mood</th><th>Struggled with (wrong tries)</th></tr>${hist}</table>
  </details>
  <details><summary>☁️ Data & sync</summary>
    <p class="note">Saved on this tablet in the app database${navigator.storage&&navigator.storage.persist?' (persistent storage: <b id="pst">checking…</b>)':''}. Cloud: ${S.sync.last?'last synced '+S.sync.last.replace('T',' ').slice(0,16):'not synced yet'}${S.sync.dirty?' · <b>changes waiting</b>':''}</p>
    <label>Apps Script Web App URL</label><input type="url" id="psu" value="${esc(S.sync.url)}" placeholder="https://script.google.com/macros/s/…/exec">
    <label>Sync token (same as TOKEN in the script)</label><input type="password" id="pst2" value="${esc(S.sync.token)}">
    <div class="row"><button id="sTest">Test connection</button><button id="sNow">Sync now ⬆</button><button class="grey" id="sPull">Restore from cloud ⬇</button></div>
    <div class="row"><button id="bExp">Download backup file</button><label class="inl" style="margin:0"><button id="bImpB" type="button">Restore from file</button><input type="file" id="bImp" accept=".json,application/json" hidden></label></div>
    <p class="note" id="smsg"></p>
    <details><summary style="font-size:14px">Error log</summary><pre>${esc(logs)}</pre></details>
  </details>
  <details><summary>🔐 Security</summary>
    <div class="row"><button id="cPin">Change PIN</button>${bioAvail()?`<button id="bioR">${LOCAL.bioId?'Re-register':'Add'} fingerprint / face</button>${LOCAL.bioId?'<button class="grey" id="bioX">Remove fingerprint / face</button>':''}`:'<span class="note">Fingerprint/face needs the app opened from its https website (GitHub Pages) in Chrome.</span>'}</div>
  </details>
  <details><summary>🧪 Test mode (for building & checking)</summary>
    <label class="inl"><input type="checkbox" id="ptm" ${S.test?'checked':''}> Test mode ON — open any day and any block, Skip button visible, nothing is saved</label>
  </details>
  <div class="row"><button id="sv">💾 Save & close</button><button class="grey" id="cl">Close</button><button class="red" id="rs">Reset everything</button></div></div>`;
  if(navigator.storage&&navigator.storage.persisted)navigator.storage.persisted().then(p=>{const x=$('#pst');if(x)x.textContent=p?'ON ✅':'not granted'});
  const msg=t=>{$('#smsg').textContent=t};
  $('#pvr').oninput=e=>{$('#prv').textContent=e.target.value};
  $('#vt').onclick=()=>{const o={...S.voice};S.voice.mode=$('#pvm').value;S.voice.rate=parseFloat($('#pvr').value);S.voice.on=true;say('नमस्ते! आज का letter है',['S','en'],'। इसकी आवाज़ है',SND.s,'।',['S for Sun!','en'],'चलो',['apples','en'],'गिनते हैं —',['one, two, three','en']).then(()=>{S.voice=o})};
  const readForm=()=>{
    S.name=$('#pn').value.trim();S.day=Math.max(1,parseInt($('#pd').value)||1);S.oncePerDay=$('#pod').checked;
    S.win={on:$('#pwo').checked,from:$('#pwf').value||'15:00',to:$('#pwt').value||'17:00'};
    S.content.off=[...m.querySelectorAll('[data-blk]')].filter(x=>!x.checked).map(x=>x.dataset.blk);
    S.content.maxCount=Math.max(0,Math.min(20,parseInt($('#pmc').value)||0));
    S.voice={on:$('#pvo').checked,mode:$('#pvm').value,rate:parseFloat($('#pvr').value)||0.9};
    S.reward=$('#prw').value.trim();S.rewardEvery=Math.max(1,parseInt($('#pre').value)||5);
    S.sync.url=$('#psu').value.trim();S.sync.token=$('#pst2').value.trim();
    S.test=$('#ptm').checked;
  };
  $('#sv').onclick=async()=>{readForm();await DB.set('state',S);if(!S.test)save();m.hidden=true;home()};
  $('#cl').onclick=()=>{m.hidden=true};
  $('#sTest').onclick=async()=>{readForm();msg('Testing…');try{await callSync('ping');msg('✅ Connected to the Google Sheet');await DB.set('state',S)}catch(e){msg('❌ '+e.message)}};
  $('#sNow').onclick=async()=>{readForm();await DB.set('state',S);msg('Syncing…');const was=S.test;S.test=false;const ok=await syncPush();S.test=was;msg(ok?'✅ Synced':'❌ Sync failed — see error log')};
  $('#sPull').onclick=async()=>{readForm();if(!confirm('Replace progress on this tablet with the copy saved in the Google Sheet?'))return;msg('Restoring…');try{await syncPull();msg('✅ Restored');setTimeout(()=>{m.hidden=true;home()},800)}catch(e){msg('❌ '+e.message)}};
  $('#bExp').onclick=()=>{const blob=new Blob([JSON.stringify({app:'hero-academy',v:APPV,saved:new Date().toISOString(),data:exportable()},null,1)],{type:'application/json'});const a=el('a');a.href=URL.createObjectURL(blob);a.download=`hero-academy-backup-${today()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)};
  $('#bImpB').onclick=()=>$('#bImp').click();
  $('#bImp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!=='hero-academy'||!j.data)throw new Error('Not a Hero Academy backup');if(!confirm('Replace progress with this backup file?'))return;const keep=S.sync;S=merge(JSON.parse(JSON.stringify(DEF)),j.data);S.sync=keep;await save();msg('✅ Restored from file');setTimeout(()=>{m.hidden=true;home()},800)}catch(err){msg('❌ '+err.message)}};
  $('#cPin').onclick=()=>pinPad('New PIN',async(p)=>{S.sec.salt=b64(crypto.getRandomValues(new Uint8Array(12)));S.sec.hash=await hashPin(p,S.sec.salt);await save();openParent()},{note:'4–6 digits',onCancel:()=>openParent()});
  if($('#bioR'))$('#bioR').onclick=async()=>{try{await bioRegister();alert('Fingerprint / face added ✅');openParent()}catch(e){alert('Could not add: '+e.message);L('bioreg '+e.message)}};
  if($('#bioX'))$('#bioX').onclick=async()=>{LOCAL.bioId='';await saveLocal();openParent()};
  $('#rs').onclick=async()=>{if(!confirm('Erase ALL progress and settings on this tablet? (Cloud copy is not touched.)'))return;S=JSON.parse(JSON.stringify(DEF));LOCAL={bioId:''};await DB.set('state',S);await saveLocal();location.reload()};
}

/* ---------- boot ---------- */
(async function boot(){
  await DB.open();
  const st=await DB.get('state');if(st)S=merge(JSON.parse(JSON.stringify(DEF)),st);
  const lo=await DB.get('local');if(lo)LOCAL=Object.assign({bioId:''},lo);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(p=>L('persist '+p))}catch(e){}
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(e=>L('sw '+e.message));
  home();
  if(!S.sec.hash)setupWizard();
  if(S.sync.dirty)syncPush();
})();
</script>
